<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Solid clean gradients for modern flat vector app icon -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Dark Slate Background -->
  <rect width="512" height="512" rx="108" fill="#0f172a" />
  
  <!-- Subtle circular boundary guide -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Main Geometric Monogram 'C' & Vector Nesting Shapes -->
  <g transform="translate(256, 230)">
    
    <!-- Outer 'C' Precision Arc -->
    <path d="M 60,-115
             A 130 130 0 1 0 60,115
             L 25,75
             A 85 85 0 1 1 25,-75
             Z"
          fill="url(#primaryGrad)" />

    <!-- Top-Right Dynamic Accent Node (Precision Vector Pen / Nesting Block) -->
    <rect x="75" y="-120" width="38" height="38" rx="8" fill="#38bdf8" />
    
    <!-- Bottom-Right Complementary Node -->
    <rect x="75" y="82" width="38" height="38" rx="8" fill="url(#accentGrad)" />

    <!-- Center Geometric Diamond / Vector Core -->
    <path d="M 0,-42 L 42,0 L 0,42 L -42,0 Z" fill="#ffffff" />
    <circle cx="0" cy="0" r="14" fill="#0284c7" />

  </g>

  <!-- Clean Minimalist Typography -->
  <text x="256" y="425" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="34" 
        font-weight="900" 
        letter-spacing="6" 
        fill="#f8fafc" 
        text-anchor="middle">
    COREL TOOLS
  </text>
  
  <text x="256" y="455" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="14" 
        font-weight="700" 
        letter-spacing="8" 
        fill="#0ea5e9" 
        text-anchor="middle">
    SUITE
  </text>
</svg>